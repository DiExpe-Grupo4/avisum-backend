spring.application.name=SafeBus

# Sin variables de entorno se usa una base H2 local persistente, para que la
# aplicación y Swagger funcionen al ejecutarlos desde el IDE. En producción,
# SPRING_DATASOURCE_* reemplaza estos valores y Spring detecta el driver MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/safebus;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=com.urbanGuard.safebus.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
